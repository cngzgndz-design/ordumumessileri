workflows:
  android-release:
    name: Android Release Workflow
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      groups:
        - android_keys
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android native project
        script: |
          npx expo prebuild --platform android --clean
      - name: Inject Keystore
        script: |
          # Base64 keystore değişkenini çözüp android/app içine release.keystore olarak kaydediyoruz
          echo $CM_KEYSTORE | base64 --decode > android/app/release.keystore
          
          # Gradle imza ayarlarını ekliyoruz
          cd android
          echo "" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD" >> gradle.properties
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab