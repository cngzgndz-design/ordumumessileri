workflows:
  expo-android-release:
    name: Expo Android Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_keys
      vars:
        PACKAGE_NAME: "com.cengizgunduz.ordumumessilleri"
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Setup Keystore
        script: |
          mkdir -p android/app
          echo $CM_KEYSTORE | base64 --decode > android/app/release.keystore
      - name: Build Android App Bundle with Expo
        script: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

          npx expo prebuild --platform android

          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$FCI_BUILD_DIR/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="354a8131dca2a32b42c2a35a3dec7b4c" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  expo-ios-release:
    name: Expo iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.cngzgndz.ordumumessilleri"
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type APP_STORE --create
      - name: Build iOS app with Expo and Xcode
        script: |
          npx expo prebuild --platform ios --clean
          cd ios && pod install && cd ..
          
          # Codemagic'in otomatik imzalama ve arşivleme aracı
          xcode-project use-profiles
          
          xcodebuild -workspace ios/Mmessilndirim.xcworkspace \
            -scheme Mmessilndirim \
            -configuration Release \
            -archivePath $FCI_BUILD_DIR/build/Mmessilndirim.xcarchive \
            -allowProvisioningUpdates \
            archive
            
          xcodebuild -exportArchive \
            -archivePath $FCI_BUILD_DIR/build/Mmessilndirim.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath $FCI_BUILD_DIR/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true