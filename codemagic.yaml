workflows:
  expo-ios-release:
    name: Expo iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.cngzgndz.ordumumessilleri"
      groups:
        # Apple Developer / App Store Connect API anahtarını Codemagic UI'da 
        # bu grup adı altında tanımlayacağız (app_store_connect_credentials vb.)
        - app_store_connect
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Set up code signing settings
        script: |
          # Codemagic App Store Connect entegrasyonu ile sertifikaları otomatik çeker
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type APP_STORE --create
      - name: Increment build number
        script: |
          # İsteğe bağlı olarak build numarasını artırabilirsin
          cd ios
          agvtool next-version -all
      - name: Build iOS app with Expo and Xcode
        script: |
          # Expo prebuild adımı (iOS klasörünü native olarak hazırlar)
          npx expo prebuild --platform ios
          
          # Pod bağımlılıklarını kur
          cd ios && pod install && cd ..
          
          # Xcode ile Archive ve IPA alma adımı
          xcodebuild -workspace ios/ordumumessilleri.xcworkspace \
            -scheme ordumumessilleri \
            -configuration Release \
            -archivePath $FCI_BUILD_DIR/build/ordumumessilleri.xcarchive \
            archive
            
          xcodebuild -exportArchive \
            -archivePath $FCI_BUILD_DIR/build/ordumumessilleri.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $FCI_BUILD_DIR/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight'a otomatik gönderim için true yapabilirsin