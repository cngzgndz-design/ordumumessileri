workflows:
  release-workflow:
    name: Android Release Build
    environment:
      groups:
        - android_keys # Codemagic panelinde CM_KEYSTORE değişkenini eklediğin grup adı
      vars:
        PACKAGE_NAME: "com.cngzgndz.ordumumessilleri" # Kendi paket adını buraya yazabilirsin
    scripts:
      - name: Set up keystore
        script: |
          # CM_KEYSTORE değişkenindeki base64 verisini çözerek projeye keystore dosyası olarak ekliyoruz
          echo $CM_KEYSTORE | base64 --decode > /tmp/release.keystore
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --pub
    publishing:
      email:
        recipients:
          - cngzgndz@gmail.com # Kendi e-posta adresini yazabilirsin
      # Codemagic panelinde tanımladığımız release_key referansını buraya bağlıyoruz
      # Not: Codemagic bu kısım için genelde arayüzdeki Code Signing ayarlarını baz alır, 
      # ancak script içinde kullanacaksan yolunu /tmp/release.keystore olarak gösterebilirsin.